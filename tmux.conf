#
# tmux.conf
#
# based on bahamas10's dotfiles style
#

# prefix key
unbind C-b
set -g prefix C-a

bind C-c new-window
bind C-p previous-window
bind C-n next-window
bind C-d detach-client
bind C-a last-window
#bind C-b next-pane
bind a send-keys C-a

# mouse support
set -g mouse on

# vim keys in copy-mode
setw -g mode-keys vi

# short escape timeout
set -s escape-time 10

# scrollback buffer
set -g history-limit 10000

# windows and panes start at 1
set -g base-index 1
set -g pane-base-index 1

# keep window numbers compact
set -g renumber-windows on

# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# intuitive pane splitting (| and - match visual orientation)
# -c "#{pane_current_path}" keeps the same directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pane resizing (repeatable with -r flag)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap panes (move them around)
bind > swap-pane -D
bind < swap-pane -U

# rotate panes within window
bind C-o rotate-window

# break pane to new window / join pane from another window
bind b break-pane
bind B command-prompt -p "join pane from window:" "join-pane -s '%%'"

# toggle zoom (already default z, but documenting)
# prefix + z toggles pane zoom

# man page in split
bind / command-prompt -p "man page:" "split-window -h 'exec man %%'"

# mouse scroll
bind -n WheelUpPane \
	if -Ft= "#{pane_in_mode}" "send-keys -M" \
	"copy-mode -e; send-keys -M"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# clipboard (cross-platform: macos pbcopy, linux xclip/xsel)
set -g @copy_cmd 'if command -v pbcopy >/dev/null; then pbcopy; elif command -v xclip >/dev/null; then xclip -selection clipboard -i; else xsel --clipboard --input; fi'

unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"

# paste from system clipboard
bind p run 'if command -v pbpaste >/dev/null; then pbpaste; elif command -v xclip >/dev/null; then xclip -selection clipboard -o; else xsel --clipboard --output; fi | tmux load-buffer - && tmux paste-buffer'

# set status bar - high contrast black/white, single line
set -g status on
set -gu status-format
set -g status-justify centre
set -g status-bg black
set -g status-fg white

set -g status-left-length 50
set -g status-left ' #H:#S │'

set -g status-right-length 30
set -g status-right '│ %m/%d %H:%M '

set-window-option -g window-status-current-format ' [#I:#W] '
set-window-option -g window-status-format ' #I:#W '

# pane borders
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=white'

# message styling
set -g message-style 'fg=black,bg=white,bold'

# copy mode highlight
set -g mode-style 'fg=black,bg=white'

# automatically set window title
setw -g automatic-rename

# set window notifications
#setw -g monitor-activity on
#set -g visual-activity on

# set system bell to chime when anything changes
set-option -g bell-action any

# terminal colors
# use tmux-256color for better compatibility, enable true color
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc,alacritty:Tc,iterm2:Tc"

# focus events for vim/nvim autoread
set -g focus-events on

